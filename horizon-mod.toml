id = "enderio"
name = "Ender IO"
version = "0.2.0"
description = """A port of Ender IO for Horizon: slice 1, the item conduit. A conduit joins another conduit or
any block with an item container on the touching side, shows its six connections as the block's own
state properties, keeps a per-side extract/insert configuration in its block entity, and moves up to
four items every twenty ticks from each extracting side into the network's inserting sides.
Filters, speed tiers, priority, dye channels, the conduit screen, facades, the wrench and probe, the
energy/fluid/redstone conduits and every machine are not ported yet."""
authors = [
    "CrazyPants", "tterrag", "HenryLoenwind", "MatthiasM", "CyanideX", "EpicSquid",
    "Rover656", "HypherionSA", "liliandev", "Ferri_Arnus", "dphaldes", "AdLf0208",
]
# A native mod: Rust in src/, compiled by the launcher against the game build [native] pins,
# beside data/ and assets/. The id is the resource namespace and the only identity: Cargo's
# package name and version are not the mod's.
api = "0.2"
# "both" is the installation side, not the hook's: an integrated server belongs to the client
# installation, so a single-player world or a LAN host needs both. A dedicated server is "server".
side = "both"
# The one shared value every manifest carries ("May add blocks, items, mob effects and entity
# types"). Ender IO really does register a block, an item and a block entity type.
capabilities = ["registries"]

[native]
game = "26.3"
horizon = "0b14f8acfd97fa2c750e42795249dcc981178ca4"
mixins = "e59da9094f0c2fdda6c627fe9eff22dec6a906f0"
